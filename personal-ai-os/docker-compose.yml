# Milestone 45: local multi-container setup. Single service today (the app
# itself) — a real production compose/k8s manifest would add a queue broker
# (Milestone 46) and a real database (Milestone 50) as separate services;
# not added here since neither has a real external backend in this phase
# (both are in-process implementations, per Phase 5's scope decision).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  app-data:
